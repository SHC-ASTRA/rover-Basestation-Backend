syntax = "proto3";

package astra;

import "vector.proto";

message CoreFeedback {
    float gps_latitude = 1;
    float gps_longitude = 2;
    uint32 gps_satellite_count = 3;

    Vector3 bno_gyroscope = 4;
    Vector3 bno_accelerometer = 5;
    float orientation = 6;

    float bmp_temperature = 7;
    float bmp_altitude = 8;
    float bmp_pressure = 9;
}